<!DOCTYPE html>
<html>
<head>
  <title>Client Details</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    body{
    margin:0;
    font-family:Arial, sans-serif;

    background-image:url("../image/view.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
}
.card,
.top-section,
.payment,
.popup-box{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(5px);
}

    .view-container {
      padding: 20px;
    }

    /* TOP SECTION */
    .top-section {
      display: flex;
      gap: 50px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    .right p {
      margin: 5px 0;
      margin-left: 20px;
    }
    .right h2 {
      
      margin-left: 20px;
    }

    /* PAYMENT */
    .payment {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* BUTTON */
    .primary-btn {
      padding: 10px 15px;
      background:  #45a049;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .primary-btn1 {
      padding: 10px 15px;
      background:  #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #45a049;
    }

    .cancel-btn {
      padding: 10px 15px;
      background:  #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
    }

    th {
      background: #eee;
    }

    td {
      min-width: 80px;
    }

    /* POPUP */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .popup-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .popup-box input {
      width: 90%;
      padding: 8px;
      margin-bottom: 10px;
    }

    .popup-actions {
      display: flex;
      justify-content: space-between;
    }

  </style>
</head>

<body>

<div class="view-container">

  <!-- TOP SECTION -->
  <div class="top-section">
    
    <div class="left">
      <img id="profileImg" src="" class="profile">
    </div>

    <div class="right">
      <h2 id="name"></h2>
      <p>DOB: <span id="dob"></span></p>
      <p>Age: <span id="age"></span></p>
      <p>Address: <span id="address"></span></p>
      <p>Pincode: <span id="pincode"></span></p>
      <p>Gender: <span id="gender"></span></p>
      <p>Phone: <span id="phone"></span></p>
    </div>

  </div>

  <!-- PAYMENT -->
  <div class="payment">
    <h3>Total Paid: ₹ <span id="paid">0</span></h3>
    <h3>Pending: ₹ <span id="pending">0</span></h3>
    
  </div>

  <!-- ADD SHEET -->
  <div style="margin-top:20px;">
    <button class="primary-btn" onclick="addSheet()">
      + Add Sheet
    </button>
  </div>

  <!-- SHEETS -->
  <div id="sheets"></div>

</div>

<!-- POPUP -->
<div id="sheetPopup" class="popup">
  <div class="popup-box">

    <h2>Sheet Details</h2>

    <label>Day</label>
    <input type="text" id="Day" placeholder="Enter number of days">

    <label>Date</label>
    <input type="date" id="sheetDate">

    <label>Rows</label>
    <input type="number" id="rows" placeholder="Enter number of rows">

    <label>Columns</label>
    <input type="number" id="cols" placeholder="Enter number of columns">

    <label>Column Names</label>
    <input type="text" id="columns" placeholder="Example: Name, Amount">

    <div class="popup-actions">
      <button class="primary-btn1" onclick="createSheet()">Add</button>
      <button class="cancel-btn" onclick="closeSheetPopup()">Cancel</button>
    </div>

  </div>
</div>

<script type="module" src="../js/view.js"></script>

</body>
</html>
