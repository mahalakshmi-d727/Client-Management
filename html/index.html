<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    body{
    margin:0;
    font-family:Arial, sans-serif;

    background-image:url("../image/login.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
}
.card,
.top-section,
.payment,
.popup-box{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(5px);
}

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 50%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .login-box {
  transition: 0.3s;
    }

    .login-box:hover {
  transform: scale(1.02);
    }
  </style>

</head>

<body>

  <div class="login-box">
    <h2>Login</h2>


<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>


  </div>

  <!-- IMPORTANT: Load JS files -->

<script type="module" src="../js/auth.js"></script>


</body>
</html>
