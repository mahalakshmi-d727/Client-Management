<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanakupillaiyin Kai Vilaiyaadal</title>

<style>
  body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
  }
  body{
    margin:0;
    font-family:Arial, sans-serif;

    background-image:url("../image/home.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
}
.card,
.top-section,
.payment,
.popup-box{
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(5px);
}

  button {
    padding: 10px 15px;
    background: linear-gradient(45deg, #007bff);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .card {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    margin-bottom: 15px;
  }

  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #ffffff;
    padding: 25px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from {
        transform: scale(0.9);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
  }

  input, select {
    width: 80%;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.3s;
  }

  input:focus, select:focus {
    border-color: blue;
    box-shadow: 0 0 5px rgba(0,0,255,0.3);
  }

  #search {
    width: 80%;
    padding: 10px;
    margin: 15px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  .header{
    background: linear-gradient(135deg,#007bff);
    background-image:url("../image/homet.jpg");
    color:rgba(0,0,0,0.8);
    text-align:center;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.header h1{
    margin:0;
    font-size:32px;
    font-weight:bold;
}

.header p{
    margin-top:8px;
    font-size:14px;
    opacity:0.9;
}
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.search-box{
    width:300px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}

.add-btn{
    background:#4CAF50;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.logout-btn{
    background:#f44336;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
.header-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.search-section{
    text-align:center;
    margin-top:20px;
}

#searchBox{
    width:350px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.add-btn{
    background:#4CAF50;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.logout-btn{
    background:#f44336;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
.action-buttons{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>KANAKUPILLAIYIN  KAI  VILAIYAADAL</h1>
    
</div>


<div class="header-buttons">
    <button class="add-btn" onclick="addNewClient()">
        + Add Client
    </button>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>
</div>

<div class="search-section">
    <input
        type="text"
        id="search"
        placeholder="Search Client..."
        onkeyup="searchClients()"
    >
</div>

<div id="clientList"></div>

<!-- MODAL -->
<div id="popup" class="modal">
  <div class="modal-content">

    <h3>Client Form</h3>

    <input id="name" placeholder="Name">
    <input id="age" placeholder="Age">
    <input id="dob" type="date">
    <input id="address" placeholder="Address">
    <input id="pincode" placeholder="Pincode">
    <input id="phone" placeholder="Phone">

    <select id="gender">
      <option value="">Select Gender</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>

    <button onclick="saveClient()">Save</button>
    <button onclick="closePopup()">Cancel</button>

  </div>
</div>

<script type="module" src="../js/home.js"></script>

</body>
</html>
