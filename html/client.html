<!DOCTYPE html>
<html>
<head>
  <title>Client Details</title>

  <!-- Handsontable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.min.css">

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    .top-box {
      display: flex;
      gap: 20px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      align-items: center;
    }

    .profile img {
      width: 120px;
      border-radius: 50%;
    }

    .info p {
      margin: 5px 0;
      font-size: 16px;
    }

    .payment-box {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .payment-box p {
      font-size: 18px;
      margin: 5px 0;
    }

    #excel {
      margin-top: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- TOP SECTION -->
  <div class="top-box">
    
    <div class="profile">
      <img id="photo">
    </div>

    <div class="info">
      <h2 id="clientName"></h2>
      <p id="dob"></p>
      <p id="age"></p>
      <p id="address"></p>
      <p id="pincode"></p>
      <p id="gender"></p>
      <p id="phone"></p>
    </div>

  </div>

  <!-- PAYMENT -->
  <div class="payment-box">
    <h3>💰 Payment</h3>
    <p>Total Paid: ₹<span id="paid">0</span></p>
    <p>Pending: ₹<span id="pending">0</span></p>
  </div>

  <!-- EXCEL -->
  <div id="excel"></div>

  <!-- Scripts -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.min.js"></script>

</body>
</html>
